[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "deeprte"
version = "1.0.1"
description = "Source code for solving radiative transfer equation using deep neural network"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ email = "mazhengcn@outlook.com" }, { name = "Zheng Ma" }]
license = { text = "Apache License, Version 2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dill>=0.3.9",
    "flax>=0.12.1",
    "grain>=0.2.9",
    "huggingface-hub>=0.30.2",
    "jax>=0.8.1",
    "matplotlib>=3.10.0",
    "omegaconf>=2.3.0",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.11.13",
    "orbax-export>=0.0.6",
    "pydantic>=2.12.5",
    "rte-dataset",
    "tensorboardx>=2.6.4",
]

[project.optional-dependencies]
cuda = ["jax-cuda13-plugin[with-cuda]>=0.8.1"]

[project.scripts]
deeprte-train = "deeprte.train_lib.train:main"

[project.urls]
homepage = "https://github.com/mazhengcn/deeprte"

[dependency-groups]
dev = ["jupyter>=1.1.1", "penzai>=0.2.4", "ruff>=0.6.3", "ty>=0.0.1a27"]

[tool.uv.sources]
rte-dataset = { git = "https://github.com/mazhengcn/rte-dataset" }
